name: Reflection prompt candidate-only evaluation

on:
  push:
    branches:
      - codex/reflection-prod-20260922
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: reflection-prompt-ab-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - name: Download run 5 baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: reflection-ab
          path: previous
          github-token: ${{ github.token }}
          run-id: 35612470295
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci --prefix candidate
      - name: Validate candidate before paid calls
        working-directory: candidate
        run: |
          npm run eval:reflection:validate
          node --experimental-strip-types --test tests/*.test.mts
          npm run validate
          node --experimental-strip-types scripts/eval-reflection-ab.mts \
            --candidate-root="$PWD" \
            --candidate-only \
            --baseline-report="$GITHUB_WORKSPACE/previous/reflection-ab.json" \
            --dry
      - name: Run 14-call candidate evaluation
        working-directory: candidate
        env:
          OPENAI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: >-
          node --experimental-strip-types scripts/eval-reflection-ab.mts
          --candidate-root="$PWD"
          --candidate-only
          --baseline-report="$GITHUB_WORKSPACE/previous/reflection-ab.json"
      - name: Report cost and hard-gate result
        if: always()
        working-directory: candidate
        run: |
          if [ -f artifacts/evaluations/reflection-ab.json ]; then
            node -e 'const r=require("./artifacts/evaluations/reflection-ab.json"); console.log(JSON.stringify({complete:r.complete,candidateHardPass:r.candidateHardPass,usage:r.usage},null,2))'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reflection-ab-candidate-only
          path: candidate/artifacts/evaluations/reflection-ab*.json
          if-no-files-found: ignore
